<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espada &amp; vazio</title>
    <meta name="description" content="RPG de mesa no mundo de Bleach: livro de regras, fichas e ferramentas do Mestre." />
    <link rel="icon" href="/art/sym-flame.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800;1,900&family=Barlow:wght@400;500;600;700&family=Caveat+Brush&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem("tema");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
